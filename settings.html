<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#20252b"><title>設定・スタフ編集 | 電子スタフ</title><style>
:root{color-scheme:dark;--bg:#15191e;--panel:#242a31;--line:#46515c;--text:#f4f6f8;--muted:#aab3bc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,a{font:inherit}button,a{border:1px solid var(--line);border-radius:11px;background:#303841;color:var(--text);padding:11px 14px;text-decoration:none;cursor:pointer}.wrap{max-width:950px;margin:auto;padding:16px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.title{font-size:28px;font-weight:850}.muted,label,th{color:var(--muted)}.muted{font-size:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px}.field input,.field select{width:100%;background:#171c21;color:white;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:570px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1;min-width:130px}.good{background:#28694d}.danger{background:#633b3b}.status{color:#70c49a;font-size:13px;min-height:20px}.note{color:var(--muted);font-size:12px;line-height:1.6}.rowbtn{padding:6px 9px;font-size:12px}@media(max-width:600px){.wrap{padding:12px}.grid{grid-template-columns:1fr}.panel{padding:13px}.title{font-size:24px}}</style></head><body><main class="wrap">
<header class="head"><div><div class="title">設定・スタフ編集</div><div class="muted">列車情報と駅時刻を編集</div></div><a href="index.html">← 運転画面へ戻る</a></header>
<section class="panel"><h2>列車情報</h2><div class="grid"><div class="field"><label>列車番号</label><input id="train" placeholder="0000A"></div><div class="field"><label>種別</label><input id="kind" placeholder="快速"></div><div class="field"><label>行先</label><input id="dest" placeholder="豊橋"></div><div class="field"><label>路線・方向</label><input id="line" placeholder="東海道本線 / 下り"></div></div><div class="actions"><button class="good" id="saveMeta">列車情報を保存</button></div></section>
<section class="panel"><h2>駅時刻・停車情報</h2><div class="grid"><div class="field"><label>駅名</label><input id="eName" placeholder="駅名"></div><div class="field"><label>扱い</label><select id="eStop"><option>停車</option><option>通過</option></select></div><div class="field"><label>着時刻</label><input id="eArr" type="time"></div><div class="field"><label>発時刻</label><input id="eDep" type="time"></div></div><div class="actions"><button class="good" id="add">駅を追加</button><button id="update">選択駅を更新</button><button class="danger" id="remove">選択駅を削除</button></div><div class="tablewrap" style="margin-top:14px"><table><thead><tr><th>順序</th><th>駅名</th><th>着</th><th>発</th><th>扱い</th><th>編集</th></tr></thead><tbody id="rows"></tbody></table></div><p class="note">駅の順序は一覧の上から順番です。一覧の編集ボタンで駅を選択できます。</p></section>
<section class="panel"><h2>遅延設定</h2><div class="grid"><div class="field"><label for="delay">遅延時間（分）</label><input id="delay" type="number" min="-60" max="180" value="0"></div></div><div class="actions"><button class="good" id="saveDelay">遅延設定を保存</button></div><p class="note">設定した遅延は運転画面の着発時刻表示に反映されます。マイナス値は早着として扱います。</p></section>
<section class="panel"><h2>データの保存・移行</h2><div class="actions"><button id="export">JSONを書き出す</button><button id="import">JSONを読み込む</button><button id="csv">駅データをCSV保存</button><input id="file" type="file" accept=".json,application/json" hidden></div><p class="note">設定はこのブラウザ内に自動保存されます。別端末とは自動同期されません。端末間で移す場合はJSONを書き出し、移行先で読み込んでください。</p></section><div id="status" class="status"></div><p class="note">本アプリは趣味・シミュレーション用です。実際の鉄道運行・乗務・保安装置の代用には使用しないでください。</p></main>
<script>
const initial={train:"123M",kind:"普通",dest:"名古屋",line:"東海道本線 / 下り",stations:[{name:"岐阜",arr:"",dep:"23:40",stop:"停車"},{name:"尾張一宮",arr:"23:49",dep:"23:50",stop:"停車"},{name:"名古屋",arr:"00:02",dep:"",stop:"停車"},{name:"金山",arr:"00:06",dep:"00:07",stop:"停車"},{name:"共和",arr:"00:17",dep:"",stop:"通過"}]};
const $=id=>document.getElementById(id);
let d;
try{d=JSON.parse(localStorage.getItem("staff")||"null")}catch(error){d=null}
if(!d||typeof d!=="object"||Array.isArray(d))d={...initial,stations:initial.stations.map(x=>({...x}))};
if(!Array.isArray(d.stations))d.stations=Array.isArray(d.timetable)?d.timetable:initial.stations.map(x=>({...x}));
d={...initial,...d};
let selected=-1;
function persist(){localStorage.setItem("staff",JSON.stringify(d))}function msg(t){$("status").textContent=t}
$("delay").value=localStorage.getItem("staffDelay")||"0";$("saveDelay").onclick=()=>{const n=Math.max(-60,Math.min(180,Number($("delay").value)||0));localStorage.setItem("staffDelay",String(n));$("delay").value=n;msg("遅延設定を保存しました。運転画面に反映されます")};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){if(!Array.isArray(d.stations))d.stations=[];["train","kind","dest","line"].forEach(k=>$(k).value=d[k]||"");$("rows").innerHTML=d.stations.length?d.stations.map((s,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(s.name)+'</td><td>'+(s.arr||"—")+'</td><td>'+(s.dep||"—")+'</td><td>'+esc(s.stop||"停車")+'</td><td><button class="rowbtn" data-i="'+i+'">編集</button></td></tr>').join(""):'<tr><td colspan="6" class="note">駅がまだ登録されていません。上の入力欄に駅名・時刻を入力して「駅を追加」を押してください。</td></tr>'}
$("saveMeta").onclick=()=>{["train","kind","dest","line"].forEach(k=>d[k]=$(k).value.trim());persist();msg("列車情報を保存しました")};
function form(){return {name:$("eName").value.trim(),arr:$("eArr").value,dep:$("eDep").value,stop:$("eStop").value}}function clear(){selected=-1;$("eName").value=$("eArr").value=$("eDep").value="";$("eStop").value="停車"}
$("add").onclick=()=>{if(!Array.isArray(d.stations))d.stations=[];let s=form();if(!s.name)return msg("駅名を入力してください");d.stations.push(s);persist();render();clear();msg("駅を追加しました")};
$("rows").onclick=e=>{let b=e.target.closest("[data-i]");if(!b)return;selected=Number(b.dataset.i);let s=d.stations[selected];$("eName").value=s.name;$("eArr").value=s.arr||"";$("eDep").value=s.dep||"";$("eStop").value=s.stop||"停車";msg((selected+1)+"番目の駅を編集中")};
$("update").onclick=()=>{if(selected<0)return msg("一覧から編集する駅を選んでください");let s=form();if(!s.name)return msg("駅名を入力してください");d.stations[selected]=s;persist();render();msg("駅情報を更新しました")};
$("remove").onclick=()=>{if(selected<0)return msg("削除する駅を選んでください");if(!confirm(d.stations[selected].name+" を削除しますか？"))return;d.stations.splice(selected,1);persist();render();clear();msg("駅を削除しました")};
function download(n,t,type){let u=URL.createObjectURL(new Blob([t],{type})),a=document.createElement("a");a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$("export").onclick=()=>{["train","kind","dest","line"].forEach(k=>d[k]=$(k).value);persist();download("digital-staff.json",JSON.stringify(d,null,2),"application/json");msg("JSONを書き出しました")};
$("import").onclick=()=>$("file").click();$("file").onchange=async e=>{try{if(!e.target.files[0])return;let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.stations))throw Error();d={...initial,...x};persist();render();clear();msg("JSONを読み込みました")}catch{msg("JSONを読み込めませんでした。ファイルを確認してください")}e.target.value=""};
$("csv").onclick=()=>download("digital-staff-stations.csv","駅名,着時刻,発時刻,扱い\r\n"+d.stations.map(s=>[s.name,s.arr||"",s.dep||"",s.stop||"停車"].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n"),"text/csv;charset=utf-8");render();
</script></body></html>
