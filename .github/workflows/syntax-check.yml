name: Syntax checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install HTML and CSS parsers
        run: npm install --no-save parse5 css-tree
      - name: Check HTML, CSS, and JavaScript syntax
        run: node scripts/check-syntax.mjs
