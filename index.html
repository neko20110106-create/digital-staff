<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#20252b"><title>電子スタフ</title>
<style>
:root{color-scheme:dark;--bg:#15191e;--panel:#242a31;--panel2:#303841;--line:#46515c;--text:#f4f6f8;--muted:#aab3bc;--accent:#d98b5c;--green:#70c49a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,a{font:inherit}button,a.btn{border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--text);padding:12px 16px;text-decoration:none;cursor:pointer}.wrap{max-width:1050px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:nowrap}.top>div{min-width:0}.top .btn{white-space:nowrap;flex:0 0 auto;padding:10px 13px;font-size:clamp(12px,3.3vw,16px)}.brandline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.brand-title{font-size:clamp(24px,5vw,34px);font-weight:850;line-height:1.2}.pill{border:1px solid var(--line);border-radius:99px;padding:5px 10px;color:var(--muted);font-size:12px;white-space:nowrap}.sub,.muted{color:var(--muted);font-size:13px}.trainbar{display:flex;gap:10px 22px;align-items:center;flex-wrap:wrap;background:#20262d;border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin:16px 0}.trainitem{display:flex;gap:7px;align-items:baseline}.trainitem small{color:var(--muted);font-size:12px}.trainitem strong{font-size:clamp(17px,3vw,23px)}.trainno strong{font-size:clamp(21px,4vw,28px);letter-spacing:.04em}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}.route{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.clock-wrap{display:flex;align-items:center;gap:9px;flex:0 0 auto}.elapsed-label{font-size:11px;color:var(--muted);font-weight:500;white-space:nowrap}.clock{font-size:clamp(28px,6vw,46px);font-weight:800;font-variant-numeric:tabular-nums}.mainstation{margin-top:14px;background:#171c21;border:2px solid #8b674e;border-radius:18px;padding:clamp(18px,4vw,30px);text-align:center;min-height:210px;display:flex;flex-direction:column;justify-content:center}.mainstation.arrived{border-color:#478765}.station-label{color:var(--muted);font-size:14px;letter-spacing:.12em}.station-name{font-size:clamp(42px,9vw,76px);font-weight:850;line-height:1.15;margin:12px 0}.station-time{font-size:clamp(24px,5vw,36px);font-weight:800;font-variant-numeric:tabular-nums}.nextline{margin-top:12px;text-align:center;color:var(--muted);font-size:15px}.nextline strong{color:var(--text);font-size:19px;margin-left:8px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1;min-width:115px}.good{background:#28694d;border-color:#469a70}.actions #arrive{background:#a94b4b;border-color:#cf7777}.actions #pass{background:#b96b27;border-color:#df914b}.actions #advance,.actions #back,.actions #reset{background:#3a424c;border-color:#56616d}.primary{background:#875333;border-color:#bd805b}.delay{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.delay input{width:85px;background:#171c21;color:white;padding:9px;border:1px solid var(--line);border-radius:9px}.status{color:var(--green);font-size:13px;min-height:20px}.footer{text-align:center;color:var(--muted);font-size:11px;line-height:1.6;margin:24px 0}
@media(max-width:600px){.wrap{padding:12px}.brand-title{font-size:clamp(21px,6vw,30px)}.brandline{gap:6px}.top .btn{padding:9px 10px;font-size:12px}.panel{padding:13px}.trainbar{padding:12px;gap:10px 16px}.trainitem{flex-wrap:wrap}.mainstation{min-height:190px}.actions button{min-width:calc(50% - 8px)}}
</style></head><body><main class="wrap">
<header class="top"><div><div class="brandline"><span class="brand-title">電子スタフ</span><span class="pill">BETA版</span></div><div class="sub">手動操作型・端末内保存</div></div><a class="btn" href="settings.html">設定・スタフ編集 ⚙</a></header>
<section class="trainbar" aria-label="列車情報"><div class="trainitem trainno"><small>列車番号</small><strong id="trainNo">123M</strong></div><div class="trainitem"><small>種別</small><strong id="kind">普通</strong></div><div class="trainitem"><small>行先</small><strong id="dest">名古屋</strong></div><div class="trainitem"><small>路線</small><strong id="line">東海道本線 / 下り</strong></div></section>
<section class="panel"><div class="route"><div><span class="pill" id="progress">1 / 5 駅</span> <strong id="state">停車中</strong></div><div class="clock-wrap"><span class="elapsed-label">経過時間</span><div class="clock" id="clock">00:00:00</div></div></div>
<div class="mainstation arrived" id="mainStation"><div class="station-label" id="stationLabel">現在駅</div><div class="station-name" id="stationName">岐阜</div><div class="station-time" id="stationTime">発 23:40</div></div>
<div class="nextline" id="nextLine">次駅 <strong>尾張一宮</strong></div>
<div class="actions"><button class="good" id="depart">出発</button><button id="arrive">停車・到着</button><button id="pass">通過</button><button class="primary" id="advance">次駅へ進む</button><button id="back">1駅戻る</button><button id="reset">リセット</button></div></section>
<div class="status" id="status"></div><footer class="footer">本アプリは趣味・シミュレーション用です。実際の鉄道運行・乗務・保安装置の代用には使用しないでください。データはこのブラウザ内に保存され、別端末とは自動同期されません。</footer>
</main><script>
const initial={train:"123M",kind:"普通",dest:"名古屋",line:"東海道本線 / 下り",stations:[{name:"岐阜",arr:"",dep:"23:40",stop:"停車"},{name:"尾張一宮",arr:"23:49",dep:"23:50",stop:"停車"},{name:"名古屋",arr:"00:02",dep:"",stop:"停車"},{name:"金山",arr:"00:06",dep:"00:07",stop:"停車"},{name:"共和",arr:"00:17",dep:"",stop:"通過"}]};
let d=JSON.parse(localStorage.getItem("staff")||"null")||initial,idx=0,state="停車中",delay=Number(localStorage.getItem("staffDelay")||0),seconds=0,last=Date.now();
const $=id=>document.getElementById(id);
function plus(t,m){if(!t)return "—";let [h,n]=t.split(":").map(Number),v=(h*60+n+m+14400)%1440;return String(v/60|0).padStart(2,"0")+":"+String(v%60).padStart(2,"0")}
function render(){const a=d.stations[idx],b=d.stations[idx+1];$("trainNo").textContent=d.train||"—";$("kind").textContent=d.kind||"—";$("dest").textContent=d.dest||"—";$("line").textContent=d.line||"—";$("progress").textContent=(d.stations.length?idx+1:0)+" / "+d.stations.length+" 駅";$("state").textContent=state;$("stationLabel").textContent=state==="運転中"||state==="通過"?"次駅":"現在駅";$("stationName").textContent=a?.name||"—";$("stationTime").textContent=a?(state==="運転中"?(a.arr?"着 "+plus(a.arr,delay):a.dep?"発 "+plus(a.dep,delay):"時刻未設定"):(a.dep?"発 "+plus(a.dep,delay):a.arr?"着 "+plus(a.arr,delay):"時刻未設定")):"—";$("mainStation").classList.toggle("arrived",state!=="運転中"&&state!=="通過");$("nextLine").innerHTML=b?'次駅 <strong>'+escapeHtml(b.name)+'</strong>':"次駅 <strong>終点</strong>";}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function msg(t){$("status").textContent=t}
$("depart").onclick=()=>{if(idx>=d.stations.length-1){state="終点";render();msg("終点のため次駅はありません");return}idx++;state="運転中";render();msg(d.stations[idx].name+" を次駅として表示中")};
$("arrive").onclick=()=>{state="停車中";seconds=0;last=Date.now();$("clock").textContent="00:00:00";render();msg(d.stations[idx]?.name+" を現在駅として表示中。経過時間をリセットしました")};
$("pass").onclick=()=>{if(idx>=d.stations.length){state="終点";render();msg("終点のため通過できる駅はありません");return}const passed=d.stations[idx]?.name||"駅";if(idx<d.stations.length-1){idx++;state="通過";render();msg(passed+" を通過扱いにしました。次駅："+d.stations[idx].name)}else{state="終点";render();msg(passed+" を通過扱いにしました。終点です")}};
$("advance").onclick=()=>{if(idx<d.stations.length-1){idx++;state=d.stations[idx].stop==="通過"?"通過":"停車中";render();msg("次駅へ進みました")}else msg("終点です")};
$("back").onclick=()=>{idx=Math.max(0,idx-1);state="停車中";render();msg("1駅戻りました")};
$("reset").onclick=()=>{idx=0;state="停車中";seconds=0;render();msg("リセットしました")};

function tick(){let n=Date.now();seconds+=Math.floor((n-last)/1000);last=n;$("clock").textContent=[seconds/3600|0,seconds%3600/60|0,seconds%60].map(v=>String(v).padStart(2,"0")).join(":")}setInterval(tick,1000);render();
</script></body></html>
